version: '3.8'

services:
  # ============================================================================
  # DATABASE LAYER (PostgreSQL 15)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: delivery_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # BACKEND MICROSERVICES
  # ============================================================================
  auth-rbac:
    build:
      context: .
      dockerfile: ./services/auth-rbac/Dockerfile
    container_name: service_auth_rbac
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3001:3001"
    volumes:
      - ./services/auth-rbac/src:/app/services/auth-rbac/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  order-management:
    build:
      context: .
      dockerfile: ./services/order-management/Dockerfile
    container_name: service_order_management
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3002:3002"
    volumes:
      - ./services/order-management/src:/app/services/order-management/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  planning-allocation:
    build:
      context: .
      dockerfile: ./services/planning-allocation/Dockerfile
    container_name: service_planning_allocation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3003:3003"
    volumes:
      - ./services/planning-allocation/src:/app/services/planning-allocation/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  fleet-directory:
    build:
      context: .
      dockerfile: ./services/fleet-directory/Dockerfile
    container_name: service_fleet_directory
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3004:3004"
    volumes:
      - ./services/fleet-directory/src:/app/services/fleet-directory/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  execution-sync:
    build:
      context: .
      dockerfile: ./services/execution-sync/Dockerfile
    container_name: service_execution_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3005:3005"
    volumes:
      - ./services/execution-sync/src:/app/services/execution-sync/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  analytics-prediction:
    build:
      context: .
      dockerfile: ./services/analytics-prediction/Dockerfile
    container_name: service_analytics_prediction
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3006
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "3006:3006"
    volumes:
      - ./services/analytics-prediction/src:/app/services/analytics-prediction/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # FRONTEND (Next.js SaaS Web App)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:80
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/frontend/src
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      - auth-rbac
      - order-management

  # ============================================================================
  # API GATEWAY (NGINX Reverse Proxy)
  # ============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - frontend
      - auth-rbac
      - order-management
      - planning-allocation
      - fleet-directory
      - execution-sync
      - analytics-prediction

volumes:
  postgres_data: