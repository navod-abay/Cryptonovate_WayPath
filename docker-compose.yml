# Shared healthcheck timing. Each service adds its own `test`; every image has
# busybox wget. 127.0.0.1 (not localhost) because alpine may resolve localhost to ::1.
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ============================================================================
  # DATABASE LAYER (PostgreSQL 15)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: delivery_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data
    healthcheck:
      # Over TCP on purpose: during first-boot init scripts Postgres only listens on
      # its unix socket, so this stays unhealthy until the schema has been applied.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MESSAGE BROKER (NATS JetStream) — dashboard alerts stream ALERTS
  #   Producers (order-management, execution-sync) relay from their own outbox tables;
  #   notification-service consumes and pushes to browsers. Monitoring: http://localhost:8222
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: delivery_nats
    restart: always
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      start_period: 10s

  # ============================================================================
  # BACKEND MICROSERVICES
  # ============================================================================
  auth-rbac:
    build:
      context: ./services/auth-rbac
      dockerfile: Dockerfile
    container_name: service_auth_rbac
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "5001:5001"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5001/health"]
    volumes:
      - ./services/auth-rbac/src:/app/src
    command: npx tsx watch src/index.ts
    depends_on:
      postgres:
        condition: service_healthy

  order-management:
    build:
      context: ./services/order-management
      dockerfile: Dockerfile
    container_name: service_order_management
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5002
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
      # Where Order Management reaches Fleet & Directory. Override per environment.
      FLEET_SERVICE_URL: ${FLEET_SERVICE_URL:-http://fleet-directory:5004}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports:
      - "5002:5002"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5002/health"]
      start_period: 60s   # seeds demo orders on first boot
    volumes:
      - ./services/order-management/src:/app/src
    command: npx tsx watch src/index.ts
    depends_on:
      postgres:
        condition: service_healthy

  planning-allocation:
    build:
      context: ./services/planning-allocation
      dockerfile: Dockerfile
    container_name: service_planning_allocation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5003
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "5003:5003"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5003/health"]
    # Planning reads orders, the fleet and the loaders (auth-rbac) as soon as it starts (catch-up),
    # so it waits until they are healthy. order-management only reports healthy after its seed step.
    depends_on:
      postgres:
        condition: service_healthy
      auth-rbac:
        condition: service_healthy
      order-management:
        condition: service_healthy
      fleet-directory:
        condition: service_healthy

  fleet-directory:
    build:
      context: ./services/fleet-directory
      dockerfile: Dockerfile
    container_name: service_fleet_directory
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5004
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "5004:5004"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5004/health"]
    volumes:
      - ./services/fleet-directory/src:/app/src
    command: npx tsx watch src/index.ts
    depends_on:
      postgres:
        condition: service_healthy

  execution-sync:
    build:
      context: ./services/execution-sync
      dockerfile: Dockerfile
    container_name: service_execution_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5005
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports:
      - "5005:5005"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5005/health"]
    volumes:
      - ./services/execution-sync/src:/app/src
    command: npx tsx watch src/index.ts
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: service_notification
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5007
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports:
      - "5007:5007"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5007/health"]
    volumes:
      - ./services/notification-service/src:/app/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  analytics-prediction:
    build:
      context: ./services/analytics-prediction
      dockerfile: Dockerfile
    container_name: service_analytics_prediction
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5006
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-delivery_db}
    ports:
      - "5006:5006"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5006/health"]
    volumes:
      - ./services/analytics-prediction/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # FRONTEND WEB APPS (Vite + React, one container per app)
  #   Build context is ./frontend so each app can reach packages/ui.
  #   VITE_* values are baked in at build time; the browser calls the gateway.
  # ============================================================================
  dispatcher:
    build:
      context: ./frontend
      dockerfile: src/dispatcher/Dockerfile
      args:
        # Dispatcher appends /api/<service> itself, so this is the gateway origin.
        VITE_API_BASE_URL: ${DISPATCHER_API_BASE_URL:-http://localhost}
        # api = real auth-rbac login, needed for live alerts; demo = built-in test account.
        VITE_LOGIN_MODE: ${DISPATCHER_LOGIN_MODE:-api}
    container_name: app_dispatcher
    restart: unless-stopped
    ports:
      - "4173:4173"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173/"]
    depends_on:
      gateway:
        condition: service_healthy

  store-manager:
    build:
      context: ./frontend
      dockerfile: src/store_manager/Dockerfile
      args:
        VITE_API_BASE_URL: ${STORE_MANAGER_API_BASE_URL:-http://localhost}
    container_name: app_store_manager
    restart: unless-stopped
    ports:
      - "4174:4173"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173/"]
    depends_on:
      gateway:
        condition: service_healthy

  loader:
    build:
      context: ./frontend
      dockerfile: src/loader/Dockerfile
      args:
        # The app appends /api/<service> itself, so this is the gateway origin.
        VITE_API_GATEWAY_URL: ${LOADER_API_GATEWAY_URL:-http://localhost}
        # The depot this kiosk stands in: a loader's PIN is checked against that depot's loaders.
        VITE_LOADER_DEPOT: ${LOADER_DEPOT:-Peliyagoda}
    container_name: app_loader
    restart: unless-stopped
    ports:
      - "4175:4173"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173/"]
    depends_on:
      gateway:
        condition: service_healthy

  # ============================================================================
  # API GATEWAY (NGINX Reverse Proxy)
  # ============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
    depends_on:
      - auth-rbac
      - order-management
      - planning-allocation
      - fleet-directory
      - execution-sync
      - analytics-prediction
      - notification-service

  # ============================================================================
  # DEV ONLY: API DOCS (Swagger UI for every microservice) -> http://localhost:8080
  #   docker compose --profile dev up
  # ============================================================================
  api-docs:
    image: swaggerapi/swagger-ui:v5.33.0
    profiles: [dev]
    container_name: dev_api_docs
    restart: unless-stopped
    environment:
      # To add a service: mount its openapi.yaml below and add an entry here.
      URLS: >-
        [
          { name: "auth-rbac", url: "specs/auth-rbac.yaml" },
          { name: "order-management", url: "specs/order-management.yaml" },
          { name: "planning-allocation", url: "specs/planning-allocation.yaml" },
          { name: "fleet-directory", url: "specs/fleet-directory.yaml" },
          { name: "execution-sync", url: "specs/execution-sync.yaml" },
          { name: "analytics-prediction", url: "specs/analytics-prediction.yaml" },
          { name: "notification-service", url: "specs/notification-service.yaml" }
        ]
      URLS_PRIMARY_NAME: auth-rbac
      PERSIST_AUTHORIZATION: "true"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./services/auth-rbac/openapi.yaml:/usr/share/nginx/html/specs/auth-rbac.yaml:ro
      - ./services/order-management/openapi.yaml:/usr/share/nginx/html/specs/order-management.yaml:ro
      - ./services/planning-allocation/openapi.yaml:/usr/share/nginx/html/specs/planning-allocation.yaml:ro
      - ./services/fleet-directory/openapi.yaml:/usr/share/nginx/html/specs/fleet-directory.yaml:ro
      - ./services/execution-sync/openapi.yaml:/usr/share/nginx/html/specs/execution-sync.yaml:ro
      - ./services/analytics-prediction/openapi.yaml:/usr/share/nginx/html/specs/analytics-prediction.yaml:ro
      - ./services/notification-service/openapi.yaml:/usr/share/nginx/html/specs/notification-service.yaml:ro

  # ============================================================================
  # DEV ONLY: SPEC LINTER (on demand, no Node needed on the host)
  #   docker compose run --rm docs-lint
  # ============================================================================
  docs-lint:
    image: redocly/cli:2.57.0
    profiles: [tools]
    working_dir: /spec
    volumes:
      - ./:/spec:ro
    command: ["lint"]

volumes:
  postgres_data:
  nats_data: