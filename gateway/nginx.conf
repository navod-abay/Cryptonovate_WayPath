events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream servers
    upstream auth_service {
        server auth-rbac:5001;
    }

    upstream order_service {
        server order-management:5002;
    }

    upstream planning_service {
        server planning-allocation:5003;
    }

    upstream fleet_service {
        server fleet-directory:5004;
    }

    upstream execution_service {
        server execution-sync:5005;
    }

    upstream analytics_service {
        server analytics-prediction:5006;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway liveness (used by the docker-compose healthcheck)
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Auth & RBAC Microservice
        location /api/auth/ {
            proxy_pass http://auth_service/;
        }

        # Order Management Microservice
        location /api/orders/ {
            proxy_pass http://order_service/;
        }

        # Planning & Allocation Microservice
        location /api/planning/ {
            proxy_pass http://planning_service/;
        }

        # Fleet Directory Microservice
        location /api/fleet/ {
            proxy_pass http://fleet_service/;
        }

        # Execution & Sync Microservice
        location /api/execution/ {
            proxy_pass http://execution_service/;
        }

        # Analytics & Prediction Microservice
        location /api/analytics/ {
            proxy_pass http://analytics_service/;
        }
    }
}
