openapi: 3.0.3
info:
  title: Auth & RBAC Service
  version: 1.0.0
  description: |
    Authentication and role-based access control. Issues dual JWTs (access + refresh).

    To call protected endpoints on any service: run `POST /login`, copy `access_token`,
    then press **Authorize** and paste it.
servers:
  - url: http://localhost/api/auth
    description: Via API gateway
  - url: http://localhost:5001
    description: Direct (local container)
tags:
  - name: Auth
  - name: System

paths:
  /login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: dispatcher_admin
              password: Password123!
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /pin-login:
    post:
      tags: [Auth]
      summary: Log a loader (depot kiosk) or driver (phone) in with their 4-digit PIN
      description: >-
        PINs are unique per role within a depot, so role, depot and PIN identify one active user. A
        driver's token carries vehicle_id, the vehicle they drive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depot, pin]
              properties:
                depot:
                  type: string
                  example: Peliyagoda
                role:
                  type: string
                  enum: [loader, driver]
                  default: loader
                pin:
                  type: string
                  pattern: '^\d{4}$'
                  example: '1234'
      responses:
        '200':
          description: Authenticated (same body as /login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                required: [success, access_token]
                properties:
                  success:
                    type: boolean
                    example: true
                  access_token:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [success, user]
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    allOf:
                      - $ref: '#/components/schemas/UserProfile'
                      - type: object
                        properties:
                          isActive:
                            type: boolean
                          createdAt:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '444':
          description: User record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /loaders:
    get:
      tags: [Auth]
      summary: List the active loaders, of all depots or one
      description: For Planning (service token, role system), which shares each day's vehicles among a depot's loaders, and dispatchers.
      security:
        - bearerAuth: []
      parameters:
        - name: depot
          in: query
          required: false
          schema:
            type: string
            example: Peliyagoda
      responses:
        '200':
          description: Loaders, ordered by depot then username
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, username, fullName, depot]
                      properties:
                        id:
                          type: string
                          format: uuid
                        username:
                          type: string
                        fullName:
                          type: string
                        depot:
                          type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a dispatcher or service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: auth-rbac

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [dispatcher, loader, driver, store_manager]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password

    UserProfile:
      type: object
      required: [id, username, role, fullName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        fullName:
          type: string
        outletId:
          type: string
          nullable: true
        depot:
          type: string
          nullable: true
        vehicleId:
          type: string
          nullable: true
          description: Drivers only, the vehicle they drive

    LoginResponse:
      type: object
      required: [success, access_token, refresh_token, user]
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_CREDENTIALS
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

  responses:
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
