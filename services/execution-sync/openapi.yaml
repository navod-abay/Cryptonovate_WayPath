openapi: 3.0.3
info:
  title: Execution Sync Service API
  version: 1.0.0
  description: Real-time execution, warehouse loading, driver telemetry, offline sync engine, and store manager confirmation microservice.
servers:
  - url: http://localhost/api/execution
    description: Via NGINX API Gateway
  - url: http://localhost:5005
    description: Direct local container access
tags:
  - name: System
  - name: Warehouse Loading
  - name: Driver Execution
  - name: Offline Sync
  - name: Store Manager Confirmation
  - name: Store Unloading

paths:
  /health:
    get:
      tags: [System]
      summary: Health Check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /docks/{depot}/active-trips:
    get:
      tags: [Warehouse Loading]
      summary: The loader's queue of trips to load
      description: >-
        Today's planned trips (Colombo date) of the vehicles Planning assigned to the calling loader,
        each with its loading status; a dispatcher sees every trip at the depot. A loader may only ask
        for their own depot.
      security:
        - BearerAuth: []
      parameters:
        - name: depot
          in: path
          required: true
          schema:
            type: string
            enum: [Peliyagoda, Kandy]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [awaiting_driver, ready_to_load, loading, completed]
        - name: date
          in: query
          required: false
          description: Plan date (YYYY-MM-DD); defaults to today in Colombo
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Trips ordered by departure time
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tripId:
                          type: string
                          example: 20261005-VEH001-T1
                        tripNumber:
                          type: integer
                        vehicleId:
                          type: string
                        vehicleType:
                          type: string
                          enum: [truck, van]
                        temperature:
                          type: string
                          enum: [frozen, ambient]
                        departureTime:
                          type: string
                          example: '03:30'
                        stops:
                          type: integer
                        status:
                          type: string
                          description: >-
                            awaiting_driver until the driver has started the trip and marked arrival
                            at the depot; then ready_to_load
                          enum: [awaiting_driver, ready_to_load, loading, completed]
                        depotArrivedAt:
                          type: string
                          format: date-time
                          nullable: true
                        dock:
                          type: string
                        loaderId:
                          type: string
                          nullable: true
                        loaderName:
                          type: string
                          nullable: true
        '403':
          description: A loader asked for another depot
        '502':
          description: Planning & Allocation is unreachable or failed

  /trips/{tripId}/manifest:
    get:
      tags: [Warehouse Loading]
      summary: Get LIFO Loading Manifest
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      description: >-
        The planned trip's stops reversed for LIFO loading. A loader may only open a trip of a vehicle
        assigned to them; the same rule applies to shortfall and dispatch.
      responses:
        '200':
          description: LIFO ordered loading manifest retrieved
        '403':
          description: The trip is assigned to another loader
        '404':
          description: No planned trip with this id
        '502':
          description: Planning & Allocation is unreachable or failed

  /trips/{tripId}/start:
    post:
      tags: [Warehouse Loading]
      summary: Start loading a trip
      description: >-
        Moves the trip to the loader's "loading" queue. Idempotent; 409 when the trip has already been
        dispatched or its driver has not marked arrival at the depot yet.
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH035-T1
      responses:
        '200':
          description: Loading started (or already started)
        '403':
          description: The trip is assigned to another loader
        '409':
          description: The trip has already been dispatched, or its driver has not arrived at the depot

  /trips/{tripId}/scans:
    post:
      tags: [Warehouse Loading]
      summary: Record one scanned unit label
      description: >-
        Every unit carries a label `<orderRef>|<sku>|<unit>`, printed as a QR code (Code 128 also works) (unit 1..quantity of the order
        line). A label scanned twice is reported as a duplicate and counted once. When every unit of an
        order is scanned or reported missing/damaged, and at least one was scanned, the order is set to
        `loaded` in Order Management as the calling loader ("loaded short" when some were reported).
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH035-T1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode:
                  type: string
                  example: ORD-20261005-00431|BUTTER-CTN|3
      responses:
        '201':
          description: Unit counted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '200':
          description: Label already scanned; nothing changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '403':
          description: The trip is assigned to another loader
        '409':
          description: The unit's order is not on this truck, every unit of the line is already accounted for, or the trip is dispatched
        '422':
          description: Not a unit label, or no such item or unit on the order

  /trips/{tripId}/shortfall:
    post:
      tags: [Warehouse Loading]
      summary: Report units missing or damaged at loading
      description: >-
        Units of one order line that will not be loaded. At most the line's units not yet scanned or
        reported. Raises a `loader.shortfall` alert for the depot's dispatchers and the outlet's store
        manager, and may complete the order (see /scans).
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH035-T1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef, sku, missingQty]
              properties:
                orderRef:
                  type: string
                sku:
                  type: string
                missingQty:
                  type: integer
                  minimum: 1
                  description: Number of units missing (or damaged, with damageFlag)
                damageFlag:
                  type: boolean
                  default: false
                  description: true = damaged and removed, false = missing
                notes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Shortfall recorded and alert queued
        '403':
          description: The trip is assigned to another loader
        '422':
          description: The order or item is not on this trip, or more units than are left were reported

  /trips/{tripId}/dispatch:
    post:
      tags: [Warehouse Loading]
      summary: Release the loaded truck
      description: >-
        Every unit must be scanned or reported, and Order Management must have accepted every loaded
        order (retried here). Orders with nothing scanned are listed in notLoaded and stay allocated.
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH035-T1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                loaderId:
                  type: string
                  format: uuid
                  description: Dispatchers only; a loader always dispatches as themselves
      responses:
        '200':
          description: Manifest completed and trip dispatched
        '403':
          description: The trip is assigned to another loader
        '409':
          description: Units are not scanned or reported yet (details.open lists them)
        '502':
          description: Order Management has not accepted an order as loaded yet

  /driver/active-route:
    get:
      tags: [Driver Execution]
      summary: The driver's trips for the day
      description: >-
        The planned trips of the vehicle in the driver's token (auth-rbac users.vehicle_id), in trip
        order, with stops in delivery order and their items, plus each trip's loading status. A
        dispatcher passes vehicleId.
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Plan date (YYYY-MM-DD); defaults to today in Colombo
          schema:
            type: string
            format: date
        - name: vehicleId
          in: query
          required: false
          description: Dispatchers only; a driver always gets their own vehicle
          schema:
            type: string
            example: VEH001
      responses:
        '200':
          description: >-
            { date, vehicleId, trips: Planning's TripDetail (tripId, tripNumber, departureTime,
            returnTime, district, stops[] with eta, window and items) plus loadingStatus
            (awaiting_driver | ready_to_load | loading | completed), driverStartedAt,
            depotArrivedAt and depotDepartedAt (null until the driver does it); each stop also has
            arrivedAt, departedAt and offlineDelivery }
        '400':
          description: A dispatcher did not name a vehicle
        '403':
          description: The driver account is not linked to a vehicle
        '502':
          description: Planning & Allocation is unreachable or failed

  /driver/trips/{tripId}/start:
    post:
      tags: [Driver Execution]
      summary: The driver started the trip
      description: Records when the driver pressed "Start Trip". Idempotent; a second call keeps the first time.
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH001-T1
      responses:
        '200':
          description: '{ tripId, driverStartedAt, depotArrivedAt }'
        '403':
          description: The trip is not on the driver's vehicle
        '404':
          description: No such trip

  /driver/trips/{tripId}/depot-arrival:
    post:
      tags: [Driver Execution]
      summary: The driver arrived at the depot
      description: >-
        Records when the driver marked "I've Arrived" at the depot. Until then the trip is
        awaiting_driver and does not appear in the loaders' Ready to Load queue. Idempotent.
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH001-T1
      responses:
        '200':
          description: '{ tripId, driverStartedAt, depotArrivedAt, loadingStatus }'
        '403':
          description: The trip is not on the driver's vehicle
        '404':
          description: No such trip
        '409':
          description: The trip has not been started yet

  /driver/trips/{tripId}/depot-departure:
    post:
      tags: [Driver Execution]
      summary: The driver leaves the depot
      description: >-
        Only after the driver checked in and the loaders released the truck (every unit of every
        order scanned or reported, then dispatched). Every order loaded on the truck becomes
        out_for_delivery in Order Management, as the driver. Idempotent: calling again re-sends any
        order Order Management did not accept.
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH001-T1
      responses:
        '200':
          description: '{ tripId, depotDepartedAt, ordersNotUpdated: orderRef[] (Order Management did not accept them yet) }'
        '403':
          description: The trip is not on the driver's vehicle
        '409':
          description: The driver has not checked in, or the truck is not loaded and released yet

  /driver/stop-events:
    post:
      tags: [Driver Execution]
      summary: Arrivals at and departures from outlet stops
      description: >-
        Sent as they happen, or as a backlog queued on the phone while it had no signal. Each event
        carries a device-generated clientEventId; every stop time keeps the earliest capturedAt, so a
        late or repeated event changes nothing. The depot is not a stop here (see depot-arrival and
        depot-departure).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [clientEventId, tripId, stopId, type, capturedAt]
                    properties:
                      clientEventId:
                        type: string
                        format: uuid
                      tripId:
                        type: string
                        example: 20261005-VEH001-T1
                      stopId:
                        type: string
                        example: 20261005-VEH001-T1-S1
                      type:
                        type: string
                        enum: [arrival, departure]
                      offline:
                        type: boolean
                        description: A departure after a delivery made without signal (photos, no store code)
                      capturedAt:
                        type: string
                        format: date-time
      responses:
        '200':
          description: '{ accepted: clientEventId[] }'
        '400':
          description: Malformed event, or a stop that is not on the trip (the phone drops it)
        '403':
          description: The trip is not on the driver's vehicle

  /telemetry:
    post:
      tags: [Driver Execution]
      summary: Push Driver GPS Telemetry Point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                driverId:
                  type: string
                vehicleId:
                  type: string
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                speed:
                  type: number
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Telemetry point logged

  /stops/{stopId}/pod:
    post:
      tags: [Driver Execution]
      summary: Record Proof of Delivery (POD)
      security:
        - BearerAuth: []
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef, podSignature]
              properties:
                routeId:
                  type: string
                orderRef:
                  type: string
                outletId:
                  type: string
                status:
                  type: string
                  enum: [delivered, partially_delivered, rejected, completed]
                podSignature:
                  type: string
                notes:
                  type: string
                actualArrivalTime:
                  type: string
                  format: date-time
                actualDepartureTime:
                  type: string
                  format: date-time
                actualServiceDurationMin:
                  type: integer
      responses:
        '201':
          description: Proof of delivery recorded

  /driver/incidents:
    post:
      tags: [Driver Execution]
      summary: Report driver incidents (single report or queued batch)
      description: >-
        Role driver. Send one incident, or `{ incidents: [...] }` to flush reports queued while offline.
        `clientEventId` is generated on the device; re-sending a report is a no-op and comes back under `duplicates`.
        Each new report raises a `driver.incident` dashboard alert (dispatcher, and the store manager of `outletId`).
        A `capturedAt` more than 5 minutes in the future is treated as the time it was received.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DriverIncident'
                - type: object
                  required: [incidents]
                  properties:
                    incidents:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/DriverIncident'
      responses:
        '201':
          description: At least one report was new
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverIncidentResult'
        '200':
          description: Every report had already been received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverIncidentResult'
        '400':
          description: Validation error

  /sync:
    post:
      tags: [Offline Sync]
      summary: Bulk Sync Offline Telemetry & Delivery Events
      description: >-
        Every delivery event stored or updated here was captured offline (photo proof, no handover code),
        so each one raises a `driver.offline_delivery` dashboard alert for the dispatcher.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [orderRef, offlineCapturedAt]
                    properties:
                      tripId:
                        type: string
                      orderRef:
                        type: string
                      outletId:
                        type: string
                      actualArrivalTime:
                        type: string
                        format: date-time
                      actualDepartureTime:
                        type: string
                        format: date-time
                      actualServiceDurationMin:
                        type: integer
                      status:
                        type: string
                        enum: [delivered, partially_delivered, rejected]
                      podSignature:
                        type: string
                      offlineCapturedAt:
                        type: string
                        format: date-time
                telemetry:
                  type: array
                  items:
                    type: object
                    required: [lat, lng]
                    properties:
                      driverId:
                        type: string
                      vehicleId:
                        type: string
                      lat:
                        type: number
                      lng:
                        type: number
                      speed:
                        type: number
                      recordedAt:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Bulk sync completed with timestamp conflict resolution

  /orders/{orderRef}/unloading:
    post:
      tags: [Store Unloading]
      summary: Vehicle arrived, start unloading
      description: |
        Store manager (own outlet) or dispatcher. Valid only while the order is `out_for_delivery`
        in Order Management. Idempotent: a repeat call returns the existing record with 200.
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unloading had already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadingResponse'
        '201':
          description: Unloading started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadingResponse'
        '403':
          description: Not allowed for this outlet or role
        '404':
          description: Order not found
        '409':
          description: Order is not out for delivery (`INVALID_STATE`)
        '502':
          description: Order Management unreachable

  /outlets/{outletId}/unloadings:
    get:
      tags: [Store Unloading]
      summary: Orders of an outlet whose unloading has started
      security:
        - BearerAuth: []
      parameters:
        - name: outletId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unloading records, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        order_ref:
                          type: string
                        started_at:
                          type: string
                          format: date-time
        '403':
          description: Store manager asked for another outlet

  /orders/{orderRef}/confirm:
    post:
      tags: [Store Manager Confirmation]
      summary: Issue the handover code for the driver
      description: |
        Store manager (own outlet) only. Requires unloading to have started and the order to be
        `out_for_delivery`. Returns a 6-digit code valid for 2 minutes; a repeat call while it is
        valid returns the same code. The driver enters it with `POST /orders/{orderRef}/handover`,
        and the store then records the receipt in Order Management (`POST /orders/{ref}/receipt`).
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Handover code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      orderRef:
                        type: string
                      deliveryId:
                        type: string
                      code:
                        type: string
                        example: '482913'
                      expiresAt:
                        type: string
                        format: date-time
        '403':
          description: Not a store manager, or another outlet's order
        '404':
          description: Order not found
        '409':
          description: Order not out for delivery (`INVALID_STATE`, `ALREADY_DELIVERED`) or unloading not started (`UNLOADING_NOT_STARTED`)

  /orders/{orderRef}/handover:
    post:
      tags: [Store Manager Confirmation]
      summary: Driver enters the handover code
      description: |
        Driver only. A correct code marks the order `delivered` in Order Management using the
        driver's own token. Each try counts; after 5 wrong tries the code locks and the store must
        issue a new one.
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Order delivered
        '400':
          description: Wrong code (`INVALID_CODE`, with `attemptsLeft`) or malformed body
        '404':
          description: No active code (`NO_ACTIVE_CODE`)
        '410':
          description: Code expired (`CODE_EXPIRED`)
        '429':
          description: Too many wrong codes (`CODE_LOCKED`)

  /deliveries/{deliveryId}/problems:
    post:
      tags: [Store Manager Confirmation]
      summary: Report a problem with a delivery that is still on the way
      description: Role store_manager. The outlet is taken from the token. Raises a `store.delivery_problem` dashboard alert for the dispatcher.
      security:
        - BearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problems]
              properties:
                problems:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                  example: [Vehicle is late, Can’t reach the driver]
                orderRef:
                  type: string
      responses:
        '201':
          description: Problem recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid

components:
  schemas:
    ScanResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
              enum: [scanned, duplicate]
            orderRef:
              type: string
            outletId:
              type: string
            sku:
              type: string
            description:
              type: string
            unit:
              type: integer
            line:
              type: object
              description: The order line's units so far
              properties:
                qty: {type: integer}
                scanned: {type: integer}
                missing: {type: integer}
                damaged: {type: integer}
                remaining: {type: integer}
            order:
              type: object
              properties:
                complete:
                  type: boolean
                  description: Every unit scanned or reported
                loaded:
                  type: boolean
                  description: Complete with at least one unit scanned
                synced:
                  type: boolean
                  description: Order Management has the order as loaded
    DriverIncident:
      type: object
      required: [clientEventId, issue, capturedAt]
      properties:
        clientEventId:
          type: string
          format: uuid
        tripId:
          type: string
        stopId:
          type: string
        outletId:
          type: string
        orderRef:
          type: string
        vehicleId:
          type: string
        issue:
          type: string
          enum: [no_receive, closed, refused, blocked]
        action:
          type: string
          example: alt_route
        notes:
          type: string
          maxLength: 1000
        capturedAt:
          type: string
          format: date-time
    DriverIncidentResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accepted:
              type: array
              items:
                type: string
                format: uuid
            duplicates:
              type: array
              items:
                type: string
                format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UnloadingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            order_ref:
              type: string
            outlet_id:
              type: string
            status:
              type: string
              example: unloading
            started_at:
              type: string
              format: date-time
            started_by:
              type: string
              nullable: true
