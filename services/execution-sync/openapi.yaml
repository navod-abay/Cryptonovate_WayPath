openapi: 3.0.3
info:
  title: Execution Sync Service API
  version: 1.0.0
  description: Real-time execution, warehouse loading, driver telemetry, offline sync engine, and store manager confirmation microservice.
servers:
  - url: http://localhost/api/execution
    description: Via NGINX API Gateway
  - url: http://localhost:5005
    description: Direct local container access
tags:
  - name: System
  - name: Warehouse Loading
  - name: Driver Execution
  - name: Offline Sync
  - name: Store Manager Confirmation
  - name: Store Unloading

paths:
  /health:
    get:
      tags: [System]
      summary: Health Check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /trips/{tripId}/manifest:
    get:
      tags: [Warehouse Loading]
      summary: Get LIFO Loading Manifest
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: LIFO ordered loading manifest retrieved

  /trips/{tripId}/shortfall:
    post:
      tags: [Warehouse Loading]
      summary: Record Item Shortfall or Damage
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef, sku]
              properties:
                orderRef:
                  type: string
                sku:
                  type: string
                missingQty:
                  type: integer
                  default: 0
                damageFlag:
                  type: boolean
                  default: false
                notes:
                  type: string
      responses:
        '201':
          description: Shortfall logged successfully

  /trips/{tripId}/dispatch:
    post:
      tags: [Warehouse Loading]
      summary: Complete Warehouse Manifest Dispatch
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                loaderId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Manifest completed and trip dispatched

  /driver/active-route:
    get:
      tags: [Driver Execution]
      summary: Get Active Route & Assigned Stops
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active route details retrieved

  /telemetry:
    post:
      tags: [Driver Execution]
      summary: Push Driver GPS Telemetry Point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                driverId:
                  type: string
                vehicleId:
                  type: string
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                speed:
                  type: number
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Telemetry point logged

  /stops/{stopId}/pod:
    post:
      tags: [Driver Execution]
      summary: Record Proof of Delivery (POD)
      security:
        - BearerAuth: []
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef, podSignature]
              properties:
                routeId:
                  type: string
                orderRef:
                  type: string
                outletId:
                  type: string
                status:
                  type: string
                  enum: [delivered, partially_delivered, rejected, completed]
                podSignature:
                  type: string
                notes:
                  type: string
                actualArrivalTime:
                  type: string
                  format: date-time
                actualDepartureTime:
                  type: string
                  format: date-time
                actualServiceDurationMin:
                  type: integer
      responses:
        '201':
          description: Proof of delivery recorded

  /sync:
    post:
      tags: [Offline Sync]
      summary: Bulk Sync Offline Telemetry & Delivery Events
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [orderRef, offlineCapturedAt]
                    properties:
                      tripId:
                        type: string
                      orderRef:
                        type: string
                      outletId:
                        type: string
                      actualArrivalTime:
                        type: string
                        format: date-time
                      actualDepartureTime:
                        type: string
                        format: date-time
                      actualServiceDurationMin:
                        type: integer
                      status:
                        type: string
                        enum: [delivered, partially_delivered, rejected]
                      podSignature:
                        type: string
                      offlineCapturedAt:
                        type: string
                        format: date-time
                telemetry:
                  type: array
                  items:
                    type: object
                    required: [lat, lng]
                    properties:
                      driverId:
                        type: string
                      vehicleId:
                        type: string
                      lat:
                        type: number
                      lng:
                        type: number
                      speed:
                        type: number
                      recordedAt:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Bulk sync completed with timestamp conflict resolution

  /orders/{orderRef}/unloading:
    post:
      tags: [Store Unloading]
      summary: Vehicle arrived, start unloading
      description: |
        Store manager (own outlet) or dispatcher. Valid only while the order is `out_for_delivery`
        in Order Management. Idempotent: a repeat call returns the existing record with 200.
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unloading had already started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadingResponse'
        '201':
          description: Unloading started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadingResponse'
        '403':
          description: Not allowed for this outlet or role
        '404':
          description: Order not found
        '409':
          description: Order is not out for delivery (`INVALID_STATE`)
        '502':
          description: Order Management unreachable

  /outlets/{outletId}/unloadings:
    get:
      tags: [Store Unloading]
      summary: Orders of an outlet whose unloading has started
      security:
        - BearerAuth: []
      parameters:
        - name: outletId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unloading records, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        order_ref:
                          type: string
                        started_at:
                          type: string
                          format: date-time
        '403':
          description: Store manager asked for another outlet

  /orders/{orderRef}/confirm:
    post:
      tags: [Store Manager Confirmation]
      summary: Issue the handover code for the driver
      description: |
        Store manager (own outlet) only. Requires unloading to have started and the order to be
        `out_for_delivery`. Returns a 6-digit code valid for 2 minutes; a repeat call while it is
        valid returns the same code. The driver enters it with `POST /orders/{orderRef}/handover`,
        and the store then records the receipt in Order Management (`POST /orders/{ref}/receipt`).
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Handover code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      orderRef:
                        type: string
                      deliveryId:
                        type: string
                      code:
                        type: string
                        example: '482913'
                      expiresAt:
                        type: string
                        format: date-time
        '403':
          description: Not a store manager, or another outlet's order
        '404':
          description: Order not found
        '409':
          description: Order not out for delivery (`INVALID_STATE`, `ALREADY_DELIVERED`) or unloading not started (`UNLOADING_NOT_STARTED`)

  /orders/{orderRef}/handover:
    post:
      tags: [Store Manager Confirmation]
      summary: Driver enters the handover code
      description: |
        Driver only. A correct code marks the order `delivered` in Order Management using the
        driver's own token. Each try counts; after 5 wrong tries the code locks and the store must
        issue a new one.
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Order delivered
        '400':
          description: Wrong code (`INVALID_CODE`, with `attemptsLeft`) or malformed body
        '404':
          description: No active code (`NO_ACTIVE_CODE`)
        '410':
          description: Code expired (`CODE_EXPIRED`)
        '429':
          description: Too many wrong codes (`CODE_LOCKED`)

  /orders/{orderRef}/dispute:
    post:
      tags: [Store Manager Confirmation]
      summary: Store Manager Order Dispute Registration
      security:
        - BearerAuth: []
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discrepancyType, description]
              properties:
                discrepancyType:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Order dispute logged

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UnloadingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            order_ref:
              type: string
            outlet_id:
              type: string
            status:
              type: string
              example: unloading
            started_at:
              type: string
              format: date-time
            started_by:
              type: string
              nullable: true
