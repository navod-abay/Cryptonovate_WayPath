  /status-batch:
    patch:
      operationId: applyStatusBatch
      tags:
        - Planning
      summary: Planning write-back (all-or-nothing, up to 500 updates)
      description: "Role: dispatcher. `allocated` needs `vehicle_id` and `trip_id` (1 or 2). `deferred` needs a `reason_code`
        and runs the full deferral sequence. Entries are applied in order. If any entry fails **nothing** is applied and
        every failure is listed in `error.details.failures[]` (HTTP 422)."
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      order_ref:
                        type: string
                        minLength: 1
                        maxLength: 32
                      status:
                        type: string
                        enum:
                          - draft
                          - confirmed
                          - allocated
                          - loaded
                          - out_for_delivery
                          - delivered
                          - received
                          - disputed
                          - deferred
                          - not_run
                          - cancelled
                      vehicle_id:
                        type: string
                        maxLength: 20
                      trip_id:
                        type: integer
                      reason_code:
                        type: string
                      reason_note:
                        type: string
                        maxLength: 1000
                    required:
                      - order_ref
                      - status
                    additionalProperties: false
                  minItems: 1
                  maxItems: 500
              required:
                - updates
              additionalProperties: false
            examples:
              allocateAndDefer:
                summary: Allocate one order, defer another
                value:
                  updates:
                    - order_ref: ORD-20260929-00042
                      status: allocated
                      vehicle_id: VEH001
                      trip_id: 1
                    - order_ref: ORD-20260929-00043
                      status: deferred
                      reason_code: NO_REEFER_AVAILABLE
                      reason_note: all 9 Peliyagoda reefers committed to trip 1
              progressOneOrder:
                summary: Move one order through several steps in order
                value:
                  updates:
                    - order_ref: ORD-20260929-00042
                      status: loaded
                    - order_ref: ORD-20260929-00042
                      status: out_for_delivery
                    - order_ref: ORD-20260929-00042
                      status: delivered
      responses:
        "200":
          description: Batch applied
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
              example:
                success: true
                data:
                  updated: 1
                  orders:
                    - order_ref: ORD-20260929-00042
                      outlet_id: OUT001
                      brand: Fresh
                      depot: Peliyagoda
                      order_date: 2026-09-29
                      original_order_date: 2026-09-29
                      requested_order_date: null
                      temp_requirement: chilled
                      status: allocated
                      order_units: 120
                      order_weight_kg: 123.6
                      order_volume_m3: 0.132
                      window_open_time: 05:00
                      window_close_time: 07:30
                      placed_by: 9595b3cf-eec1-4559-9fcc-889ef5a9280c
                      placed_by_username: manager_out001
                      placed_at: 2026-09-28T04:30:00.000Z
                      confirmed_at: 2026-09-28T04:35:00.000Z
                      cutoff_applied_at: 2026-09-28T04:35:00.000Z
                      deferral_count: 0
                      vehicle_id: VEH001
                      trip_id: 1
                      idempotency_key: null
                      created_at: 2026-09-28T04:30:00.412Z
                      updated_at: 2026-09-28T04:35:00.108Z
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
