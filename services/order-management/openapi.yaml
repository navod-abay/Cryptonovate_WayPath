openapi: 3.0.3
info:
  title: Order Management Service
  version: 0.1.0
  description: Delivery order lifecycle operations.
servers:
  - url: http://localhost/api/orders
    description: Via API gateway
  - url: http://localhost:3002
    description: Direct (local container)
tags:
  - name: Orders
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /orders:
    get:
      tags: [Orders]
      summary: List orders (placeholder data)
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

components:
  schemas:
    Health:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        id:
          type: string
          example: ord_101
        customer:
          type: string
          example: Acme Corp
        itemsCount:
          type: integer
          example: 12
        status:
          type: string
          example: PENDING
