openapi: 3.0.3
info:
  title: Planning & Allocation Service
  version: 0.2.0
  description: >-
    Route planning and resource allocation engine (Go). Every day from 16:00 (Asia/Colombo) the service
    closes ordering for the next run date in Order Management, reads the confirmed pool and the available
    fleet, plans it with ALNS3 (algorithm 3), stores the trips and deferrals, and writes allocations and
    deferrals back to Order Management. Every path is also served under /api/planning for services that
    call Planning directly.


    Authentication: every endpoint except /health needs an auth-rbac access token
    (`Authorization: Bearer <JWT>`, HS256, signed with JWT_ACCESS_SECRET and verified locally) or a
    service token with role `system`. Roles: dispatchers read schedules, deferrals, trips and planning
    runs; loaders read only the trips of the vehicles assigned to them (each plan shares a depot's
    vehicles among its loaders); drivers read only the trips of the vehicle in their token; store
    managers have no access.
    Starting a planning run by hand needs a service token: the 16:00 run starts itself.
security:
  - BearerAuth: []
servers:
  - url: http://localhost/api/planning
    description: Via API gateway
  - url: http://localhost:5003
    description: Direct (local container)
tags:
  - name: Schedule
  - name: Trips
  - name: Planning
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /schedule/summary:
    get:
      tags: [Schedule]
      summary: Schedule summary for both depots
      description: Vehicles used, trips, fleet / weight / volume utilisation, total weight and volume, orders served and deferred, distance and fuel, per depot and in total.
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Summary for the day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /depots/{depot}/schedule:
    get:
      tags: [Schedule]
      summary: Schedule of one depot
      description: Every vehicle with its trips (at most two) and the stops of each trip in visiting order, from the date's completed planning run. Before that run exists, `vehicles` is empty and `planRunId` is absent.
      parameters:
        - $ref: '#/components/parameters/Depot'
        - $ref: '#/components/parameters/Date'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The depot's schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepotSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown depot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schedule/deferrals:
    get:
      tags: [Schedule]
      summary: Orders deferred for the day, with the reason
      parameters:
        - $ref: '#/components/parameters/Date'
        - name: depot
          in: query
          required: false
          description: Only this depot's deferrals (case-insensitive). Both depots when omitted.
          schema:
            type: string
            enum: [Peliyagoda, Kandy]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Deferred orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferralList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /trips:
    get:
      tags: [Trips]
      summary: Planned trips with stops and items to load
      description: >-
        Trips of the date's completed plan, ordered by vehicle and trip number. Used by Execution & Sync.
        A loader only gets the trips assigned to them, whatever loaderId says (another depot is 403);
        a driver only gets their own vehicle's trips, whatever vehicleId says.
      parameters:
        - $ref: '#/components/parameters/Date'
        - name: depot
          in: query
          required: false
          schema:
            type: string
            enum: [Peliyagoda, Kandy]
        - name: vehicleId
          in: query
          required: false
          schema:
            type: string
            example: VEH003
        - name: loaderId
          in: query
          required: false
          description: Only the trips assigned to this loader (auth-rbac user id)
          schema:
            type: string
            format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Trips (empty before the date is planned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: One planned trip
      description: Stops in delivery order, each with the order lines copied when the plan was made. Execution & Sync reverses the stops for LIFO loading.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            example: 20261005-VEH003-T1
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '404':
          description: No trip with this id in a completed plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /planning-runs:
    post:
      tags: [Planning]
      summary: Plan a date now
      description: >-
        Service token (role `system`) only; no user role may start a run. The daily run starts by itself at
        16:00 (Asia/Colombo); this is for an operator re-running a date the scheduler gave up on after
        PLANNING_MAX_ATTEMPTS failures. Queues a run and returns immediately; poll GET /planning-runs/{runId}.
        Without planDate, plans Order Management's next run date. A date with a queued, running or
        completed run cannot be planned again (409).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPlanningRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Planning run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The date already has a queued, running or completed run (returned in the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRun'
        '502':
          description: Order Management could not say which date to plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Planning]
      summary: Planning runs for a date, newest first
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Runs, including failed attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningRun'
        '400':
          $ref: '#/components/responses/BadRequest'

  /planning-runs/{runId}:
    get:
      tags: [Planning]
      summary: One planning run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            example: run_402aec0787d4b1f8
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRun'
        '404':
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Date:
      name: date
      in: query
      required: false
      description: Day to report on, YYYY-MM-DD (Asia/Colombo). Defaults to today.
      schema:
        type: string
        format: date
        example: '2026-10-02'
    Depot:
      name: depot
      in: path
      required: true
      description: Depot name (case-insensitive)
      schema:
        type: string
        enum: [Peliyagoda, Kandy]

  responses:
    BadRequest:
      description: Invalid parameter or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: access token has expired
    Forbidden:
      description: The token's role may not use this endpoint, or a loader asked for another depot or for a trip assigned to someone else
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'role "dispatcher" may not do this; requires one of: system'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: date must be YYYY-MM-DD
    DepotSummary:
      type: object
      properties:
        depot:
          type: string
          example: Peliyagoda
        vehiclesAvailable:
          type: integer
        vehiclesUsed:
          type: integer
        trips:
          type: integer
        fleetUtilization:
          type: number
          description: Vehicles used / vehicles available (0-1)
        weightUtilization:
          type: number
          description: Loaded weight / weight capacity of the trips run (0-1)
        volumeUtilization:
          type: number
          description: Loaded volume / volume capacity of the trips run (0-1)
        totalWeightKg:
          type: number
        totalVolumeM3:
          type: number
        ordersServed:
          type: integer
        ordersDeferred:
          type: integer
        totalDistanceKm:
          type: number
        fuelLitres:
          type: number
    ScheduleSummary:
      type: object
      properties:
        date:
          type: string
          format: date
        depots:
          type: array
          items:
            $ref: '#/components/schemas/DepotSummary'
        totals:
          $ref: '#/components/schemas/DepotSummary'
    StopItem:
      type: object
      properties:
        sku:
          type: string
          example: MLK-1L
        description:
          type: string
        qty:
          type: integer
    Stop:
      type: object
      properties:
        stopId:
          type: string
          example: 20261005-VEH003-T1-S1
        sequence:
          type: integer
        orderRef:
          type: string
        outletId:
          type: string
        brand:
          type: string
          enum: [Fresh, Style, Tech]
        temperature:
          type: string
          enum: [chilled, ambient]
        weightKg:
          type: number
        volumeM3:
          type: number
        eta:
          type: string
          example: '04:18'
        windowOpen:
          type: string
          example: '05:00'
        windowClose:
          type: string
          example: '07:30'
        lateMin:
          type: number
          description: Minutes after windowClose the vehicle is planned to arrive (0 = on time)
        items:
          type: array
          description: Only on the /trips endpoints
          items:
            $ref: '#/components/schemas/StopItem'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          example: 20261005-VEH003-T1
          description: <YYYYMMDD>-<vehicleId>-T<tripNumber>
        tripNumber:
          type: integer
          enum: [1, 2]
        brand:
          type: string
          enum: [Fresh, Style, Tech]
        district:
          type: string
        departureTime:
          type: string
          example: '03:30'
        returnTime:
          type: string
        durationMin:
          type: integer
          description: Booklet trip time (outbound + inter-stop + handling)
        distanceKm:
          type: number
        fuelLitres:
          type: number
        weightKg:
          type: number
        volumeM3:
          type: number
        weightUtilization:
          type: number
        volumeUtilization:
          type: number
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            planDate:
              type: string
              format: date
            depot:
              type: string
            vehicleId:
              type: string
            vehicleType:
              type: string
              enum: [truck, van]
            vehicleTemperature:
              type: string
              enum: [reefer, ambient]
            weightCapacityKg:
              type: number
            volumeCapacityM3:
              type: number
            planRunId:
              type: string
            loaderId:
              type: string
              format: uuid
              description: The loader who loads this vehicle (all its trips); absent when the depot had no loader at planning time
            loaderName:
              type: string
    VehicleSchedule:
      type: object
      properties:
        vehicleId:
          type: string
        type:
          type: string
          enum: [truck, van]
        temperature:
          type: string
          enum: [reefer, ambient]
        weightCapacityKg:
          type: number
        volumeCapacityM3:
          type: number
        loaderId:
          type: string
          format: uuid
          description: The loader who loads this vehicle; absent when the depot had no loader at planning time
        loaderName:
          type: string
        trips:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
    DepotSchedule:
      type: object
      properties:
        date:
          type: string
          format: date
        depot:
          type: string
        planRunId:
          type: string
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleSchedule'
    DeferredOrder:
      type: object
      properties:
        orderRef:
          type: string
        outletId:
          type: string
        depot:
          type: string
        district:
          type: string
        brand:
          type: string
        temperature:
          type: string
          enum: [chilled, ambient]
        weightKg:
          type: number
        volumeM3:
          type: number
        orderDate:
          type: string
          format: date
        timesDeferred:
          type: integer
          description: How many earlier days this order was already deferred
        reason:
          type: string
          description: Order Management deferral reason code, as written back with status-batch
          enum: [CAPACITY_WEIGHT, CAPACITY_VOLUME, NO_REEFER_AVAILABLE, NO_VAN_FOR_VAN_ONLY_OUTLET, TIME_BUDGET_EXCEEDED, FUEL_QUOTA_EXCEEDED, VEHICLE_UNAVAILABLE]
        reasonDetail:
          type: string
          example: All refrigerated vehicles at Peliyagoda are fully booked within the 270-minute Fresh budget.
    DeferralList:
      type: object
      properties:
        date:
          type: string
          format: date
        depot:
          type: string
        count:
          type: integer
        orders:
          type: array
          items:
            $ref: '#/components/schemas/DeferredOrder'
    StartPlanningRequest:
      type: object
      properties:
        planDate:
          type: string
          format: date
          description: Day to plan; defaults to Order Management's next run date. Must not be in the past.
        trigger:
          type: string
          enum: [cron, manual]
          default: manual
    PlanningRun:
      type: object
      properties:
        runId:
          type: string
          example: run_1d800738570d950e
        planDate:
          type: string
          format: date
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        trigger:
          type: string
          enum: [cron, manual, catchup]
          description: cron = the daily 16:00 run; catchup = a past day or today planned when the service starts; manual = POST /planning-runs
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        stats:
          $ref: '#/components/schemas/RunStats'
    RunStats:
      type: object
      properties:
        orders:
          type: integer
          description: Confirmed orders in the pool
        served:
          type: integer
        deferred:
          type: integer
        trips:
          type: integer
        vehiclesUsed:
          type: integer
        iterations:
          type: integer
          description: ALNS iterations per seed (0 when a catch-up run replayed a seeded plan)
        seeds:
          type: integer
          description: ALNS runs with different seeds, best kept (PLANNING_SEEDS, default 5; PLANNING_CATCHUP_SEEDS, default 1, for catch-up runs; 0 when a catch-up run replayed a seeded plan)
        bestSeed:
          type: integer
        objective:
          type: number
          description: Plan cost of the chosen solution (without the lost-second-trip term)
        solveMs:
          type: integer
    Health:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          example: healthy
        db:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time
